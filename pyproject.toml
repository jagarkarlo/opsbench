[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsbench"
version = "0.5.2"
description = "Reproducible safety and reliability benchmark for AI-assisted DevOps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Karlo Jagar" },
]
dependencies = []

[project.scripts]
opsbench = "opsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]