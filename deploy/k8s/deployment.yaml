apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsbench-server
  namespace: opsbench
  labels:
    app.kubernetes.io/name: opsbench-server
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: opsbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsbench-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsbench-server
        app.kubernetes.io/component: api-server
        app.kubernetes.io/part-of: opsbench
    spec:
      containers:
        - name: opsbench-server
          image: ghcr.io/jagarkarlo/opsbench:latest
          imagePullPolicy: IfNotPresent
          args:
            - "serve"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--gallery-path"
            - "scenarios"
            - "--db"
            - "/app/data/benchmarks.db"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: opsbench-storage
              mountPath: /app/data
      volumes:
        - name: opsbench-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opsbench-server
  namespace: opsbench
  labels:
    app.kubernetes.io/name: opsbench-server
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: opsbench
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: opsbench-server
