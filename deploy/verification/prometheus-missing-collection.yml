global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: verification-test-service
    static_configs:
      # Deliberately wrong port: the test service listens on 8000.
      - targets: ["test-service:8001"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
