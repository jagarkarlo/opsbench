name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag-matches-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --editable .

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import opsbench; print(opsbench.__version__)')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag v$tag_version does not match opsbench.__version__ ($package_version)"
            exit 1
          fi
          echo "tag v$tag_version matches package version $package_version"

      - name: Run public safety scan
        run: ./scripts/public_safety_scan.sh

      - name: Run tests
        run: python -m unittest discover -s tests -v
