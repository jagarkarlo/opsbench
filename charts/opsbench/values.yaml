replicaCount: 1

image:
  repository: ghcr.io/jagarkarlo/opsbench
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: "traefik"
  annotations: {}
  hosts:
    - host: opsbench.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Bearer token required on all API endpoints except /api/v1/health.
# Leave empty to run unauthenticated (not recommended outside local dev).
apiToken: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
